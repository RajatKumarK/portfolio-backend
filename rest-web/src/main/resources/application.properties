spring.application.name=portfolio-backend
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/portfolio_db
spring.datasource.username=your_username
spring.datasource.password=your_password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update

# JWT Configuration
app.jwt.secret=YourSecretKeyHereShouldBeAtLeast64BytesLongAndVerySecureWithRandomCharacters
app.jwt.expiration=3600000  # 1 hour
app.jwt.refresh-expiration=86400000  # 24 hours

# Social media API configuration
social.linkedin.api-url=https://api.linkedin.com
social.linkedin.access-token=your_linkedin_access_token

social.twitter.api-url=https://api.twitter.com
social.twitter.bearer-token=your_twitter_bearer_token

social.youtube.api-url=https://www.googleapis.com
social.youtube.api-key=your_youtube_api_key
social.youtube.channel-id=your_youtube_channel_id

social.github.api-url=https://api.github.com
social.github.username=your_github_username
social.github.access-token=your_github_access_token

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Admin email to receive notifications
app.admin.email=your-admin-email@example.com

scheduler.github.cron =0 0 */12 * * *
scheduler.social-media.fixed-rate=3600000

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

